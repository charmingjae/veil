# Checks every pull request into main, and every push to it: lint, types, both builds, and the
# package as it would be published. On main, once every check passes, the playground is deployed
# to GitHub Pages (https://charmingjae.github.io/veil), so the demo never runs code that failed.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Redeploys the demo by hand, after running the checks again.
  workflow_dispatch:

# Each job asks for what it needs; nothing by default.
permissions: {}

# A newer commit on a pull request cancels the check still running for the last one. On main,
# runs queue up instead, so a deployment is never cut off halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # Read-only, so pull requests from forks can't reach anything else in the repository.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm version in package.json's `packageManager`.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Fails if pnpm-lock.yaml doesn't match the package.json files.
      - run: pnpm install --frozen-lockfile
      # The package first, then the playground, whose types and build use the package's dist.
      - name: Build
        run: pnpm build
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm --recursive typecheck
      # publint and arethetypeswrong on the package as `npm pack` would publish it.
      - name: Check the package
        run: pnpm --filter @-3-/veil check

  build-demo:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To read the Pages site's base path.
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: pages
        uses: actions/configure-pages@v6
      # Built again, this time under the site's base path (`/veil`).
      - name: Build
        run: pnpm build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/playground/out

  deploy-demo:
    needs: build-demo
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
